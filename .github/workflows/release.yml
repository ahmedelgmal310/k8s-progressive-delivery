name: Release

# Builds, scans, signs and publishes the image for every change to the service
# on main, then opens the dev promotion PR that bumps the image tag.
on:
  push:
    branches: [main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/demo-api
  TRIVY_IMAGE: mirror.gcr.io/aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c

jobs:
  publish:
    name: Build, scan, push, sign
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: demo-api:scan
          build-args: VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=demo-api
      - name: Trivy vulnerability gate (HIGH/CRITICAL)
        run: |
          mkdir -p /tmp/img && docker save demo-api:scan -o /tmp/img/demo-api.tar
          docker run --rm -v /tmp/img:/img "$TRIVY_IMAGE" image --input /img/demo-api.tar \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push (with SBOM and provenance attestations)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:main
          build-args: VERSION=${{ steps.meta.outputs.tag }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=demo-api
          cache-to: type=gha,scope=demo-api,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify signature
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/heads/main$" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          {
            echo "Published \`${IMAGE}:${{ steps.meta.outputs.tag }}\`"
            echo
            echo "Digest \`${DIGEST}\` (signed keyless with cosign; SBOM + provenance attached)"
          } >> "$GITHUB_STEP_SUMMARY"

  promote-dev:
    name: Open dev promotion PR
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.publish.outputs.tag }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh label create promotion --color 0E8A16 --description "Image promotion between environments" 2>/dev/null || true
          ./scripts/promote.sh dev "$TAG" "Built from ${GITHUB_SHA} (${DIGEST}) by run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}."
